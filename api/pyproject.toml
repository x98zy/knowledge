[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "alibabacloud-oss-v2>=1.3.1",
    "asyncmy>=0.2.11",
    "chardet>=7.6.0",
    "fastapi>=0.136.1",
    "faststream[cli,kafka]>=0.7.2",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "jwt>=1.4.0",
    "loguru>=0.7.3",
    "openai>=2.43.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymilvus==3.0.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis[hiredis]>=8.0.0",
    "sqlalchemy>=2.0.49",
    "tiktoken>=0.13.0",
    "uuid7>=0.1.0",
    "uvicorn>=0.49.0",
    "volcengine-python-sdk[ark]>=5.0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.14.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # do not perform function call in argument defaults (FastAPI uses this pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "extensions", "models", "router"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
